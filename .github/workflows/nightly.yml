name: Nightly

# 每次推送到 main 自动编译 macOS（Apple 芯片 + Intel）、Windows（x64）与 Linux（x64），覆盖发布到 `nightly` 预发布版。
# 预发布版不算 "latest"，正式版用户的自动更新不会拿到 nightly。只改文档时不触发。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "frontend/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            target: aarch64-apple-darwin
          - name: x64
            target: x86_64-apple-darwin
    name: macos-${{ matrix.name }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      # 用固定的自签名证书签名（不是 ad-hoc），app 的签名身份在各版本间保持不变，
      # 更新后系统不会收回辅助功能 / 输入监控权限。证书不受 Gatekeeper 信任，首次打开仍需 xattr。
      - name: Import code signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "::error::缺少 secret MACOS_CERT_P12"; exit 1; fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$kc"

      # Nightly 不走自动更新，所以不生成更新包，也就不需要签名私钥。
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: Hoshiro Self-Signed
        run: bun run tauri build --target ${{ matrix.target }} --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify code signature
        run: |
          app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          req=$(codesign -d -r- "$app" 2>&1 | grep designated)
          echo "$req"
          # 自签名证书的身份要求写作 "certificate root"，ad-hoc 签名则是 "cdhash"
          if ! echo "$req" | grep -q 'certificate' || echo "$req" | grep -q 'cdhash'; then echo "::error::app 不是用证书签名的（可能退回了 ad-hoc）"; exit 1; fi
          codesign --verify --deep --strict "$app"

      - name: Rename
        run: |
          mkdir -p out
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "out/Hoshiro_nightly_${GITHUB_SHA::7}_${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.name }}
          path: out/*.dmg
          if-no-files-found: error

  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: x86_64-pc-windows-msvc

      - run: bun install --frozen-lockfile

      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build
        shell: bash
        run: bun run tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Rename
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/Hoshiro_nightly_${GITHUB_SHA::7}_x64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-windows
          path: out/*.exe
          if-no-files-found: error

  linux:
    name: linux-x64
    # 自建 runner（labels: self-hosted, linux, x64, hyt-hk, ci，即 hyt-hk-ci）。仓库变量 LINUX_RUNS_ON 设成 JSON 字符串 "ubuntu-latest"（含引号）可临时改回 GitHub 托管机器。
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted","linux","x64","hyt-hk","ci"]') }}
    # 在预装依赖的 Ubuntu 22.04 镜像里编译（见 linux-image.yml）：链接 glibc 2.35，产物能在 22.04 及更新的发行版上运行。
    # cargo 下载缓存与 target 目录放在宿主机 /opt/hoshiro-ci，跨次构建保留，只做增量编译。
    container:
      image: ghcr.io/icyblue17/hoshiro-linux-build:22.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/hoshiro-ci/cargo-registry:/usr/local/cargo/registry
        - /opt/hoshiro-ci/cargo-git:/usr/local/cargo/git
        - /opt/hoshiro-ci/nightly:/ci-cache
    env:
      CARGO_TARGET_DIR: /ci-cache/target
      BUN_INSTALL_CACHE_DIR: /ci-cache/bun
      XDG_CACHE_HOME: /ci-cache/xdg # Tauri 下载的 linuxdeploy / AppRun 也留在本机
      # release 增量编译：只改了几个文件时，编译从约 60 秒降到 15 秒（nightly 不追求极致优化）
      CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
    steps:
      - uses: actions/checkout@v4

      - run: bun install --frozen-lockfile

      # release profile：依赖与随后的打包共用同一份编译结果，不用再编一遍 debug 版
      - run: cargo test --release --lib --manifest-path src-tauri/Cargo.toml

      # 上一次构建留下的安装包（可能是旧版本号）不能混进这次的产物
      - run: rm -rf "$CARGO_TARGET_DIR/release/bundle"

      - name: Build
        # rpm 打包器的压缩有约 60 秒的固定开销，nightly 不压缩（正式版用 zstd 19）
        run: bun run tauri build --bundles deb,rpm,appimage --config '{"bundle":{"createUpdaterArtifacts":false,"linux":{"rpm":{"compression":{"type":"none","level":null}}}}}'

      - name: Rename
        run: |
          mkdir -p out
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          b="$CARGO_TARGET_DIR/release/bundle"
          cp $b/deb/*.deb "out/Hoshiro_nightly_${short}_amd64.deb"
          cp $b/rpm/*.rpm "out/Hoshiro_nightly_${short}_x86_64.rpm"
          cp $b/appimage/*.AppImage "out/Hoshiro_nightly_${short}_amd64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-linux
          path: out/*
          if-no-files-found: error

      # 容器里以 root 运行：把工作目录的属主还给宿主机上的 runner 用户，后面跑在宿主机上的任务才能写入
      - name: Restore workspace ownership
        if: always()
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP")" "$GITHUB_WORKSPACE"

  publish:
    needs: [build, windows, linux]
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted","linux","x64","hyt-hk","ci"]') }}
    steps:
      # 下载到 runner 的临时目录（每个任务开始时清空），不碰工作目录
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/out
          merge-multiple: true

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          short=${GITHUB_SHA::7}
          cat > notes.md <<EOF
          由 main 分支最新提交 [\`${short}\`](https://github.com/${GH_REPO}/commit/${GITHUB_SHA}) 自动编译，未经测试，可能不稳定，也不会自动更新。日常使用请下载[正式版](https://github.com/${GH_REPO}/releases/latest)。

          | 芯片 | 安装包 |
          |---|---|
          | Apple 芯片（M 系列） | \`Hoshiro_nightly_${short}_aarch64.dmg\` |
          | Intel | \`Hoshiro_nightly_${short}_x64.dmg\` |
          | Windows 10/11 (x64) | \`Hoshiro_nightly_${short}_x64-setup.exe\` |
          | Linux (x64) | \`Hoshiro_nightly_${short}_amd64.deb\`、\`Hoshiro_nightly_${short}_x86_64.rpm\`、\`Hoshiro_nightly_${short}_amd64.AppImage\` |

          首次打开如果提示“已损坏”，在终端执行 \`xattr -cr /Applications/Hoshiro.app\`。
          EOF
          gh release delete nightly --cleanup-tag --yes || true
          out="$RUNNER_TEMP/out"
          gh release create nightly "$out"/*.dmg "$out"/*.exe "$out"/*.deb "$out"/*.rpm "$out"/*.AppImage --prerelease --target "$GITHUB_SHA" \
            --title "Nightly (${short})" --notes-file notes.md
