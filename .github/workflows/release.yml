name: Release

# 推送 v* 标签（如 v0.1.1）时编译 macOS（Apple 芯片 + Intel）、Windows（x64）与 Linux（x64），签名更新包，发布正式版并附上 latest.json 供应用内自动更新。
# 需要仓库 secrets：TAURI_SIGNING_PRIVATE_KEY（更新包签名）、MACOS_CERT_P12 / MACOS_CERT_PASSWORD（代码签名证书）。
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64
            target: aarch64-apple-darwin
          - name: x64
            target: x86_64-apple-darwin
    name: macos-${{ matrix.name }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      # 用固定的自签名证书签名（不是 ad-hoc），app 的签名身份在各版本间保持不变，
      # 更新后系统不会收回辅助功能 / 输入监控权限。证书不受 Gatekeeper 信任，首次打开仍需 xattr。
      - name: Import code signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "::error::缺少 secret MACOS_CERT_P12"; exit 1; fi
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$kc"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: Hoshiro Self-Signed
        with:
          args: --target ${{ matrix.target }} --bundles app,dmg
          tagName: ${{ github.ref_name }}
          releaseName: Hoshiro ${{ github.ref_name }}
          releaseBody: |
            | 芯片 | 安装包 |
            |---|---|
            | Apple 芯片（M 系列） | `aarch64.dmg` |
            | Intel | `x64.dmg` |
            | Windows 10/11 (x64) | `x64-setup.exe` |
            | Linux (x64) | `amd64.deb`（Debian / Ubuntu）、`x86_64.rpm`（Fedora / openSUSE）、`amd64.AppImage`（其他发行版） |

            已安装旧版本的用户会通过应用内更新自动收到。安装包没有经过 Apple 公证，首次打开如果提示“已损坏”，在终端执行 `xattr -cr /Applications/Hoshiro.app`。
          releaseDraft: true # 两个架构都通过签名检查后，由 publish 任务转为正式版
          prerelease: false
          includeUpdaterJson: true

      - name: Verify code signature
        run: |
          app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          req=$(codesign -d -r- "$app" 2>&1 | grep designated)
          echo "$req"
          # 自签名证书的身份要求写作 "certificate root"，ad-hoc 签名则是 "cdhash"
          if ! echo "$req" | grep -q 'certificate' || echo "$req" | grep -q 'cdhash'; then echo "::error::app 不是用证书签名的（可能退回了 ad-hoc）"; exit 1; fi
          codesign --verify --deep --strict "$app"

  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: x86_64-pc-windows-msvc

      - run: bun install --frozen-lockfile

      # 单元测试在 Windows 上跑一遍（含 Windows 平台层的纯逻辑测试）
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # NSIS 安装包 + 签名的更新包；tauri-action 会把 windows-x86_64 合并进同一个 latest.json。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: Hoshiro ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  linux:
    name: linux-x64
    # 自建 runner（labels: self-hosted, linux, x64, hyt-hk, release，即 hyt-hk-release）。仓库变量 LINUX_RUNS_ON 设成 JSON 字符串 "ubuntu-latest"（含引号）可临时改回 GitHub 托管机器。
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted","linux","x64","hyt-hk","release"]') }}
    # 在预装依赖的 Ubuntu 22.04 镜像里编译（见 linux-image.yml）：链接 glibc 2.35，产物能在 22.04 及更新的发行版上运行。
    # cargo 下载缓存与 target 目录放在宿主机 /opt/hoshiro-ci，跨次构建保留，只做增量编译。
    container:
      image: ghcr.io/icyblue17/hoshiro-linux-build:22.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /opt/hoshiro-ci/cargo-registry:/usr/local/cargo/registry
        - /opt/hoshiro-ci/cargo-git:/usr/local/cargo/git
        - /opt/hoshiro-ci/release:/ci-cache
    env:
      CARGO_TARGET_DIR: /ci-cache/target
      BUN_INSTALL_CACHE_DIR: /ci-cache/bun
      XDG_CACHE_HOME: /ci-cache/xdg # Tauri 下载的 linuxdeploy / AppRun 也留在本机
    steps:
      - uses: actions/checkout@v4

      - run: bun install --frozen-lockfile

      # release profile：依赖与随后的打包共用同一份编译结果，不用再编一遍 debug 版
      - run: cargo test --release --lib --manifest-path src-tauri/Cargo.toml

      # 上一次构建留下的安装包（可能是旧版本号）不能混进这次的产物
      - run: rm -rf "$CARGO_TARGET_DIR/release/bundle"

      # deb / rpm / AppImage + 签名的更新包（AppImage 与 deb / rpm 各自的更新包都写进同一个 latest.json）。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles deb,rpm,appimage
          tagName: ${{ github.ref_name }}
          releaseName: Hoshiro ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  publish:
    needs: [build, windows, linux]
    runs-on: ${{ fromJSON(vars.LINUX_RUNS_ON || '["self-hosted","linux","x64","hyt-hk","release"]') }}
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
